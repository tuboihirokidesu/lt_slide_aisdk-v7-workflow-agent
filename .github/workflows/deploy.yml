name: Deploy pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          pnpm run build --base "$BASE_PATH"
          node scripts/create-slide-redirects.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./dist

  deploy:
    needs: build
    if: ${{ github.event.repository.private == false || vars.ENABLE_GITHUB_PAGES_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0

  pages-deploy-skipped:
    needs: build
    if: ${{ github.event.repository.private == true && vars.ENABLE_GITHUB_PAGES_DEPLOY != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain skipped deployment
        run: |
          echo "::notice::Skipped GitHub Pages deployment because this repository is private and ENABLE_GITHUB_PAGES_DEPLOY is not true. GitHub Pages for private repositories requires a supported GitHub plan."
